<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producer Flow Academy — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=DM+Mono:wght@400;500&family=Syne:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap" style="max-width:420px;padding-top:12vh">
  <div class="brand">Producer Flow Academy — <span>Dashboard</span></div>
  <h1 style="margin-bottom:2rem">Sign in</h1>
  {% if error %}<p style="color:var(--status-failed);font-size:0.85rem;margin-bottom:1rem">{{ error }}</p>{% endif %}
  <form method="post" style="display:flex;flex-direction:column;gap:1rem">
    <input type="password" name="password" placeholder="Password" autofocus
      style="background:var(--warm);border:1px solid var(--line);color:var(--text);font-family:'Syne',sans-serif;font-size:0.9rem;padding:0.8em 1em">
    <button type="submit" class="btn-primary">Enter</button>
  </form>
</div>
</body>
</html>
